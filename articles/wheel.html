      function b64ToBytes(b64) {
        const bin = atob(b64);
        const out = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
        return out;
      }

      async function tryDecrypt(password) {
        const keyMaterial = await crypto.subtle.importKey(
          "raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]
        );
        const key = await crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: b64ToBytes(SALT), iterations: 100000, hash: "SHA-256" },
          keyMaterial,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"]
        );
        const plain = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: b64ToBytes(IV), tagLength: 128 },
          key,
          b64ToBytes(DATA)
        );
        return new TextDecoder().decode(plain);
      }

      document.getElementById("pw-submit").addEventListener("click", async () => {
        const err = document.getElementById("error");
        err.style.display = "none";
        try {
          const text = await tryDecrypt(document.getElementById("pw").value);
          document.getElementById("lock").style.display = "none";
          const article = document.getElementById("article");
          article.textContent = text;
          article.style.display = "block";
        } catch {
          err.style.display = "block";
        }
      });

      document.getElementById("pw").addEventListener("keydown", e => {
        if (e.key === "Enter") document.getElementById("pw-submit").click();
      });
